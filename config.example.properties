# The first values for Free My Tablet. The tablet's own settings (Free My Tablet > Settings) win over these.
# Copy this file to config.properties and change it there: config.properties stays out of git.

# Your city, for the sunrise and the sunset (decimal degrees).
latitude=-23.31028
longitude=-51.16278
# The name on the weather card (optional).
city=

# "auto" (follows the tablet), "en", "es" or "pt".
language=auto

# "C", "F" or "auto".
temperature=auto

# Also turn off the voice assistant (Google Assistant) when Free My Tablet mode is on.
disable_assistant=false
