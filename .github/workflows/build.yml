name: Build

# Every push: does the app still build? (the tag builds the release)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK (ANDROID_HOME).
      - name: The Android SDK
        run: |
          sdkmanager --install "platforms;android-30" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" || true

      - name: The tests
        run: ./run-tests.sh

      - name: Build
        env:
          # The version of the last release (so a build of the main branch is not older than the release).
          FREE_MY_TABLET_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: The APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTablet
          path: FreeMyTablet.apk
